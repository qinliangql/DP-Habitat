# @package _global_

# Hyperparameters and ResNet18 from on https://arxiv.org/abs/2012.0611

defaults:
  - /benchmark/nav/pointnav: pointnav_gibson
  - /habitat_baselines: habitat_baselines_rl_config_base
  - _self_

habitat:
  simulator:
    enable_human: 1 # 2 Muti Threads；0 no human
    human_path: "data/humanoids/humanoid_data"
    human_list: ["avatar_0","avatar_1","avatar_2","avatar_3","avatar_4","avatar_5","avatar_6","avatar_7","avatar_8","avatar_9","avatar_10","avatar_11",
                "male_0","male_1","male_2","male_3","female_0","female_1","female_2","female_3"]
    human_num: 4

habitat_baselines:
  load_resume_state_config: False
  verbose: False
  trainer_name: "ppo"
  torch_gpu_id: 0
  tensorboard_dir: "tb"
  video_dir: "video_dir/ppo_gibson_pointnav"
  # Evaluate on all episodes
  test_episode_count: -1
  eval_ckpt_path_dir: "data/new_checkpoints/ppo_gibson_pointnav2/eval"  # eval folder 模型存放地方
  num_environments: 1
  checkpoint_folder: "data/new_checkpoints/ppo_gibson_pointnav" # train 并且resume state都是存在这里，state stateeval
  num_updates: -1
  total_num_steps: 75e6
  log_interval: 25
  num_checkpoints: 100
  # Force PyTorch to be single threaded as
  # this improves performance considerably
  force_torch_single_threaded: True

  eval:
    video_option: [ ]
    should_load_ckpt: True  # 评估单个checkpoints
    # Can be uncommented to generate videos.
    # video_option: ["disk", "tensorboard"]

  rl:
    ppo:
      # ppo params
      clip_param: 0.2
      ppo_epoch: 4
      num_mini_batch: 2
      value_loss_coef: 0.5
      entropy_coef: 0.01
      lr: 2.5e-4
      eps: 1e-5
      max_grad_norm: 0.5
      num_steps: 128
      hidden_size: 512
      use_gae: True
      gamma: 0.99
      tau: 0.95
      use_linear_clip_decay: True
      use_linear_lr_decay: True
      reward_window_size: 50

      # Use double buffered sampling, typically helps
      # when environment time is similar or larger than
      # policy inference time during rollout generation
      use_double_buffered_sampler: False
